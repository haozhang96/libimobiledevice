name: Build macOS binaries

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
    steps:
    - name: Set up build system
      run: |
        if test -x "`which port`"; then
          sudo port install libtool gcc autoconf automake pkgconfig usbmuxd openssl libzip libxml2 libcurl
        else
          brew install libtool gcc autoconf automake pkgconfig usbmuxd openssl libzip libxml2 libcurl
        fi

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Prepare environment
      run: |
        echo "target_triplet=`gcc -dumpmachine`" >> $GITHUB_ENV
        git config --global user.name "${{github.actor}}"
        git config --global user.email "${{github.actor_id}}+${{github.actor}}@users.noreply.github.com"
        git config --global core.autocrlf false

    # libimobiledevice deps (1-3/8), libimobiledevice (4/8), and then unrelated projects (5-8/8)
    - name: Build libimobiledevice suite
      run: |
        repos=("libplist" "libimobiledevice-glue" "libusbmuxd" "libtatsu" "libimobiledevice" "libideviceactivation" "ideviceinstaller" "libirecovery" "idevicerestore")
        for repo in "${repos[@]}"; do
            echo "Building $repo..."
            if [ $repo = "libimobiledevice" ]; then
              # libimobiledevice: Build after merging PR #1711 to add MCInstall/ideviceprofile support.
              git clone "https://github.com/libimobiledevice/$repo"
              pushd "$repo" > /dev/null
              git pull origin refs/pull/1711/head --rebase
            elif [ $repo = "idevicerestore" ]; then
              # idevicerestore: Build after adding fix from https://github.com/libimobiledevice/idevicerestore/issues/788.
              git clone --depth=1 --recursive "https://github.com/libimobiledevice/$repo"
              pushd "$repo" > /dev/null

              target="void finalize_progress(uint32_t tag)"
              sed -i "/^$target/{n;d;}" src/common.c
              sed -i "/^$target/a { thread_once(&progress_info_once, _init_progress_info);" src/common.c
            else
              # Build other dependencies as they are
              git clone --depth=1 --recursive "https://github.com/libimobiledevice/$repo"
              pushd "$repo" > /dev/null
            fi
            ./autogen.sh CC=gcc CXX=g++ --enable-debug --without-cython
            sudo make -j install
            popd > /dev/null
        done

    - name: Prepare release
      run: |
        mkdir -p rel
        DESTDIR=`pwd`/rel make install
        tar -C rel -cJvf libimobile-suite-latest_macOS_x64.tar.xz usr

    - name: Draft release
      env:
        github_token: ${{secrets.GITHUB_TOKEN}}
      run: |
        TAG="${GITHUB_REF##*/}-${GITHUB_SHA:0:7}"
        gh release create "$TAG" --draft --title "Draft Release"
        gh release upload "$TAG" libimobile-suite-latest_macOS_x64.tar.xz
